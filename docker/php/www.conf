[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 15
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
pm.process_idle_timeout = 10s

pm.status_path = /status
ping.path = /ping

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
